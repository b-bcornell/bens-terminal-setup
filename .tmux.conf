# Remap prefix from Ctrl+B to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Close a session and its processes when its terminal tab disconnects
set -g destroy-unattached on

# Clear screen and scrollback with Ctrl+K (triggered by Cmd+K in Ghostty)
# 1. Clear tmux pane and scrollback
# 2. Send CSI 3 J via passthrough to clear Ghostty's scrollback
bind-key -n C-k send-keys C-l \; clear-history \; run-shell 'printf "\033Ptmux;\033\033[3J\033\\"'

# Enable mouse mode for proper scrolling
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'roosta/tmux-fuzzback'

# Fuzzback config - floating popup (requires tmux 3.2+)
set -g @fuzzback-popup 1

# Change keybind to 'f' (triggered after Prefix)
set -g @fuzzback-bind f

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# System clipboard integration (macOS)
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Use vi mode for copy mode
setw -g mode-keys vi

# Copy entire scrollback to clipboard with Ctrl+A then C
bind C run-shell "tmux capture-pane -pS -32768 | pbcopy"

# Allow OSC sequences to pass through to Ghostty
set -g allow-passthrough on

# Enable RGB color support for Ghostty
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Keep the active pane's folder and Git branch visible beneath the terminal tabs.
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-left-length 120
set -g status-right-length 100
set -g status-left '#{pane_current_path}'
set -g status-right '#(/Users/ben.cornell/.local/bin/tmux-git-branch #{pane_id})'

# Each Ghostty tab is a group; tmux windows are its inner tabs.
set -g status 2
set -g status-format[0] '#[align=left]#{pane_current_path}#[align=right]#(/Users/ben.cornell/.local/bin/tmux-git-branch #{pane_id})'
set -g status-format[1] '#[align=left]Inner tabs: #{W:#[range=window|#{window_index}] #I:#W #[norange] ,#[range=window|#{window_index} reverse] #I:#W #[norange default] }'
set -g renumber-windows on
bind c new-window -c '#{pane_current_path}'

# Move live inner tabs between adjacent Ghostty groups, pop one out, or tile them.
bind U set-option -Fg @tab_group_probe '#{session_id}'
bind G run-shell -b '/Users/ben.cornell/.local/bin/tab-groups merge left #{pane_id}'
bind O run-shell -b '/Users/ben.cornell/.local/bin/tab-groups merge right #{pane_id}'
bind P run-shell -b '/Users/ben.cornell/.local/bin/tab-groups pop #{pane_id}'
bind T run-shell -b '/Users/ben.cornell/.local/bin/tab-groups panes #{pane_id}'

# The usual inner-tab shortcuts select panes while the group is tiled.
bind p if-shell -F '#{?@tab_group_tile,1,0}' 'select-pane -t :.-' 'previous-window'
bind n if-shell -F '#{?@tab_group_tile,1,0}' 'select-pane -t :.+' 'next-window'

# Save a named group bookmark and reopen one from the picker.
bind B run-shell -b '/Users/ben.cornell/.local/bin/tab-groups bookmark save #{pane_id}'
bind V run-shell -b '/Users/ben.cornell/.local/bin/tab-groups bookmark choose #{pane_id}'
